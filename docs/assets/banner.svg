<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Buzz for OpenClaw</title><desc id="desc">A native OpenClaw channel plugin connecting agent sessions to a self-hosted Buzz relay over Nostr. Conceptual flow: Buzz conversation to Nostr transport to OpenClaw routing to Agent session.</desc><rect width="1200" height="360" rx="16" fill="#0d2028"/><path d="M40 44h28v28H40z M47 51h14v14H47z" fill="#8de4cc" fill-rule="evenodd"/><g font-family="Arial,Helvetica,sans-serif"><text x="85" y="64" fill="#a5bdc4" font-size="13" letter-spacing="2">SELF-HOSTED AGENT MESSAGING</text><text x="40" y="139" fill="#fcfbf4" font-size="38" font-weight="700">Buzz for OpenClaw</text><text x="40" y="193" fill="#c7d5d7" font-size="23">Your relay.</text><text x="40" y="226" fill="#c7d5d7" font-size="23">Your agent conversations.</text><text x="40" y="313" fill="#8de4cc" font-size="14">INTEGRATION PREVIEW  /  Apache-2.0 declared</text><rect x="590" y="92" width="248" height="76" rx="9" fill="#152b35" stroke="#37515a"/><text x="608" y="117" fill="#8de4cc" font-size="12">01</text><text x="608" y="145" fill="#f4f4eb" font-size="17">Buzz conversation</text><rect x="862" y="92" width="248" height="76" rx="9" fill="#152b35" stroke="#37515a"/><text x="880" y="117" fill="#8de4cc" font-size="12">02</text><text x="880" y="145" fill="#f4f4eb" font-size="17">Nostr transport</text><rect x="590" y="194" width="248" height="76" rx="9" fill="#152b35" stroke="#37515a"/><text x="608" y="219" fill="#8de4cc" font-size="12">03</text><text x="608" y="247" fill="#f4f4eb" font-size="17">OpenClaw routing</text><rect x="862" y="194" width="248" height="76" rx="9" fill="#152b35" stroke="#37515a"/><text x="880" y="219" fill="#8de4cc" font-size="12">04</text><text x="880" y="247" fill="#f4f4eb" font-size="17">Agent session</text><path d="M850 130h8 M714 175v13 M986 175v13 M850 232h8" stroke="#8de4cc" stroke-width="2"/><text x="590" y="313" fill="#a5bdc4" font-size="12" letter-spacing="2">CONCEPTUAL FLOW / NOT A PRODUCT SCREENSHOT</text></g></svg>
