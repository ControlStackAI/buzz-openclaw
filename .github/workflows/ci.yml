name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      # Install as a required fixture dependency: npm may silently omit an optional peer.
      - run: npm install --prefix .ci/sdk --package-lock=false --ignore-scripts
      - run: ln -s ../.ci/sdk/node_modules/openclaw node_modules/openclaw
      - run: npm test
      - run: npm pack --dry-run
